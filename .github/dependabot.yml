version: 2
updates:
  # Go-зависимости корня и модуля core/
  - package-ecosystem: gomod
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: gomod
    directory: '/core'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # GitHub Actions (workflows Build/Release/CodeQL)
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
