name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet (клиент)
        run: go vet ./...

      - name: Test (клиент)
        run: go test ./...

      # core — отдельный модуль (wg-turn-client, см. replace в go.mod)
      - name: Vet (ядро)
        working-directory: core
        run: go vet ./...

      - name: Test (ядро)
        working-directory: core
        run: go test ./...

  build-linux-windows:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # Обычная go build: Wails/Node/webkit больше не нужны (Этап 1)
      - name: Build Linux
        run: GOOS=linux GOARCH=amd64 go build -o xwdtt-linux-amd64

      - name: Build Windows
        run: GOOS=windows GOARCH=amd64 go build -o xwdtt-windows-amd64.exe

      - name: Upload Linux artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: xwdtt-linux-amd64
          path: xwdtt-linux-amd64

      - name: Upload Windows artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: xwdtt-windows-amd64
          path: xwdtt-windows-amd64.exe

  build-macos:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: "Build macOS (universal: amd64 + arm64)"
        run: |
          GOOS=darwin GOARCH=amd64 go build -o xwdtt-macos-amd64
          GOOS=darwin GOARCH=arm64 go build -o xwdtt-macos-arm64
          lipo -create -output xwdtt-macos xwdtt-macos-amd64 xwdtt-macos-arm64

      - name: Zip macOS binary
        if: github.event_name != 'pull_request'
        run: zip XWDTT-macos.zip xwdtt-macos

      - name: Upload macOS artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: xwdtt-macos
          path: XWDTT-macos.zip
