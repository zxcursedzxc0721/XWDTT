name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: pwdtt-linux-amd64
          path: dist

      - name: Download Windows artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: pwdtt-windows-amd64
          path: dist

      - name: Download macOS artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: pwdtt-macos
          path: dist

      - name: List dist contents
        run: find dist/ -maxdepth 3 -ls

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/pwdtt-linux-amd64
            dist/pwdtt-windows-amd64.exe
            dist/PWDTT-macos.zip
          body: |
            ## PWDTT v1.5.1


            - Парсинг ссылок изза чего не работали старвые сервера.
            - Добавлено информация о подключении текущий ip и задержка. 
            - Реализация WG, AutoStart, Update  для MacOS (by @alextixru)
            

            **Platforms:**
            - Linux x86_64
            - Windows x86_64
            - macOS (Universal: Intel + Apple Silicon)
