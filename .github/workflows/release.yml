name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: pwdtt-linux-amd64
          path: dist

      - name: Download Windows artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          name: pwdtt-windows-amd64
          path: dist

      - name: List dist contents
        run: find dist/ -maxdepth 3 -ls

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/pwdtt-linux-amd64
            dist/pwdtt-windows-amd64.exe
          body: |
            ## PWDTT v1.5.0

            **Новое:**
            - Сбор отчёта об ошибках — информация о системе и логах копируются в буфер для отправки в Issue
            - Проверка обновлений — автоматическая проверка актуальной версии при запуске
            - Поддержка ссылок `qwdtt://` — быстрое добавление серверов по ссылке
            - Режимы обфускации — выбор между audio и video в настройках

            **Улучшения:**
            - Полная переработка интерфейса для удобства использования
            - Улучшена работа автозапуска на Linux
            - Исправлена запись логов в файлы
            - Улучшена маршрутизация на Windows

            **Удалено:**
            - Деплой — вырезан (совместимость с оригинальным wdtt сохранена)
            - Системный трей — удалён из-за некорректной работы

            **Platforms:**
            - Linux x86_64
            - Windows x86_64
