name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Build и Release стартуют одновременно на один и тот же тег, поэтому
      # сначала дожидаемся успешного прогона Build (vet+test+сборка ~5-10 мин),
      # и только потом качаем артефакты этого коммита.
      # Ищем строго прогон ЭТОГО тега (head_branch == ref_name): на один коммит
      # может быть два Build-прогона (push в main + push тега), и выбор по
      # head_sha наугад скачал артефакты ещё не завершившегося прогона.
      - name: Wait for Build run to finish
        id: waitbuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Waiting for build.yml run on tag $GITHUB_REF_NAME ..."
          for i in $(seq 1 90); do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$GITHUB_SHA" \
              --jq ".workflow_runs[] | select(.head_branch == \"$GITHUB_REF_NAME\") | \"\(.id) \(.status) \(.conclusion)\"" | head -1 || true)
            rid=$(echo "$run" | cut -d' ' -f1)
            status=$(echo "$run" | cut -d' ' -f2)
            conclusion=$(echo "$run" | cut -d' ' -f3)
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "Build succeeded (run $rid)."
                echo "run_id=$rid" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Build run finished with conclusion=$conclusion"
              exit 1
            fi
            echo "[$i/90] build status: ${status:-not-started}"
            sleep 20
          done
          echo "Timed out waiting for build."
          exit 1

      # run_id привязывает артефакты к конкретному завершённому прогону —
      # без него dawidd6 выбирал бы прогон по commit_sha наугад (ссылка на
      # коммит общая для main- и tag-прогонов).
      - name: Download Linux artifact
        uses: dawidd6/action-download-artifact@v27
        with:
          workflow: build.yml
          run_id: ${{ steps.waitbuild.outputs.run_id }}
          name: xwdtt-linux-amd64
          path: dist

      - name: Download Windows artifact
        uses: dawidd6/action-download-artifact@v27
        with:
          workflow: build.yml
          run_id: ${{ steps.waitbuild.outputs.run_id }}
          name: xwdtt-windows-amd64
          path: dist

      - name: Download macOS artifact
        uses: dawidd6/action-download-artifact@v27
        with:
          workflow: build.yml
          run_id: ${{ steps.waitbuild.outputs.run_id }}
          name: xwdtt-macos
          path: dist

      - name: List dist contents
        run: find dist/ -maxdepth 3 -ls

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum xwdtt-linux-amd64 xwdtt-windows-amd64.exe XWDTT-macos.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/xwdtt-linux-amd64
            dist/xwdtt-windows-amd64.exe
            dist/XWDTT-macos.zip
            dist/SHA256SUMS
          # Тело релиза генерируется из коммитов (generate_release_notes) —
          # зашитый changelog эпохи v1.6.0 описывал не то, что попадает в релиз.
          body: |
            ## XWDTT ${{ github.ref_name }}

            Контрольные суммы — см. SHA256SUMS (sha256sum -c).

            **Platforms:**
            - Linux x86_64
            - Windows x86_64
            - macOS (Universal: Intel + Apple Silicon)
